<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GIS Primary Curriculum Navigator</title>
<style>
:root{
  --ink:#011A57;          /* Deep Blue - body copy */
  --green:#219360;        /* Garden Green - CTA / emphasis */
  --gold:#AE8B5A;         /* Gold - emphasis / links */
  --sheer:#D6C6AC;        /* Sheer Gold - titles */
  --beige:#F0EAE2;        /* section background */
  --forest:#14332E;       /* brand manual side block */
  --e1:#A3C862;           /* element bar: green (Pantone 360) */
  --e2:#D2E3A4;           /* element bar: light green (367) */
  --e3:#C09B5E;           /* element bar: brown (4645) */
  --e4:#9A5B31;           /* element bar: light brown (4635) */
  --paper:#ffffff;
  --line:rgba(1,26,87,.14);
  --rail:246px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Trebuchet MS",ّ,Verdana,sans-serif;
  color:var(--ink);background:var(--paper);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit}
a{color:var(--gold)}

/* ---------- element bar: the brand's four-band rule, used as this app's spine ---------- */
.ebar{display:flex;height:5px;width:100%}
.ebar span{flex:1}
.ebar span:nth-child(1){background:var(--e2)}
.ebar span:nth-child(2){background:var(--e1)}
.ebar span:nth-child(3){background:var(--e3)}
.ebar span:nth-child(4){background:var(--e4)}
.ebar.short{width:104px}

/* ---------- left rail ---------- */
.rail{
  position:fixed;inset:0 auto 0 0;width:var(--rail);background:var(--forest);color:#fff;
  display:flex;flex-direction:column;z-index:40;
}
.brand{padding:26px 22px 18px}
.brand .crest{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--sheer)}
.brand h1{font-size:21px;line-height:1.2;margin:10px 0 6px;font-weight:700;color:#fff}
.brand p{margin:0;font-size:12px;color:rgba(255,255,255,.62);font-style:italic}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  background:none;border:0;padding:10px 12px;border-radius:3px;cursor:pointer;
  color:rgba(255,255,255,.78);font-size:14.5px;
}
.nav button .tick{width:3px;height:16px;background:transparent;border-radius:2px;flex:0 0 3px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[aria-current="page"]{color:#fff;background:rgba(255,255,255,.10)}
.nav button[aria-current="page"] .tick{background:var(--e1)}
.railfoot{margin-top:auto;padding:16px 22px 22px;font-size:11.5px;color:rgba(255,255,255,.45);line-height:1.5}

/* ---------- main ---------- */
.main{margin-left:var(--rail);min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:12px 40px;display:flex;gap:16px;align-items:center;
}
.search{position:relative;flex:1;max-width:520px}
.search input{
  width:100%;padding:9px 14px 9px 34px;border:1px solid var(--line);border-radius:2px;
  font-size:14.5px;background:var(--paper);color:var(--ink);font-family:inherit;
}
.search input::placeholder{color:rgba(1,26,87,.42)}
.search input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
.search .mag{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;font-size:14px}
.topbar .hint{font-size:12.5px;color:rgba(1,26,87,.5)}
.wrap{padding:34px 40px 80px;max-width:1180px}

/* ---------- section headings, in the manual's style ---------- */
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--ink)}
.eyebrow + .ebar{margin:6px 0 26px}
h2.display{font-size:32px;line-height:1.12;color:var(--gold);margin:0 0 8px;font-weight:700}
h3.display{font-size:22px;color:var(--gold);margin:0 0 6px;font-weight:700}
.lede{max-width:66ch;margin:0 0 26px;color:rgba(1,26,87,.78)}

/* ---------- chips / tabs ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{
  border:1px solid var(--line);background:var(--paper);padding:7px 15px;border-radius:2px;
  font-size:14px;cursor:pointer;color:var(--ink);
}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:#fff}
.chip:focus-visible,.card:focus-visible,.nav button:focus-visible,.cell:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* ---------- term cards ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
@media (max-width:1120px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.card{
  text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:2px;
  padding:0 0 18px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(1,26,87,.10);border-color:var(--sheer)}
.card .cap{height:5px;width:100%}
.card .body{padding:16px 18px 0}
.card .term{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(1,26,87,.5);font-weight:700}
.card h4{margin:6px 0 8px;font-size:19px;line-height:1.2;color:var(--ink)}
.card p{margin:0;font-size:13.5px;color:rgba(1,26,87,.7);line-height:1.5}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:3px 8px;border-radius:2px;background:var(--beige);color:var(--gold);margin-top:12px}

/* ---------- unit detail ---------- */
.back{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;font-size:13.5px;margin-bottom:18px}
.back:hover{text-decoration:underline}
.unithead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-bottom:4px}
.unithead .meta{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(1,26,87,.55);font-weight:700}
.panel{background:var(--beige);padding:22px 26px;border-radius:2px;margin:22px 0 30px}
.panel h5{margin:0 0 8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.panel p{margin:0;font-size:16px;line-height:1.6}
.strands{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:2px 34px}
.strand{padding:20px 0;border-top:1px solid var(--line)}
.strand .lbl{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.strand .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.strand .lbl span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.strand .txt{font-size:14.5px;line-height:1.62;white-space:pre-wrap;color:rgba(1,26,87,.86)}
.strand .txt b{color:var(--ink)}
.ptbox{border-left:3px solid var(--green);padding:2px 0 2px 18px}

/* ---------- progression matrix ---------- */
.tgblock{border-top:1px solid var(--line);padding:26px 0 8px}
.tgblock .code{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--green);text-transform:uppercase}
.tgblock .tgtitle{font-size:16.5px;max-width:80ch;margin:6px 0 18px;color:var(--ink)}
.track{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.cell{
  display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
  text-align:left;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:2px;
  padding:0 0 14px;cursor:pointer;position:relative;overflow:hidden;
}
.cell .yr,.cell .kpi,.cell .more{display:block}
.cell .yr{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:rgba(1,26,87,.5);padding:12px 14px 0}
.cell .kpi{font-size:13.5px;line-height:1.5;padding:6px 14px 0;color:var(--ink)}
.cell:hover{border-color:var(--sheer);background:#fffdf9}
.cell[aria-expanded="true"]{background:var(--beige);border-color:var(--sheer)}
.cell .more{font-size:11.5px;color:var(--gold);padding:10px 14px 0;display:block}
.ksu{grid-column:1/-1;background:var(--beige);padding:20px 24px;border-radius:2px;margin-top:-2px}
.ksu dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px 30px}
.ksu dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:4px}
.ksu dd{margin:0;font-size:14px;line-height:1.55}
.ksu .head{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--forest);margin-bottom:12px}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(1,26,87,.6);font-weight:700;background:var(--paper)}
thead tr{border-bottom:2px solid var(--sheer)}
td:first-child{font-weight:700}
tbody tr:hover{background:#fbfaf7}
.tablewrap{overflow-x:auto;margin-bottom:36px}
.tablewrap table{min-width:1080px;font-size:13.5px}

/* ---------- transfer goals ---------- */
.tgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
.tgcard{border:1px solid var(--line);border-radius:2px;padding:0 0 6px;overflow:hidden}
.tgcard .cap{height:5px}
.tgcard h4{margin:16px 20px 12px;font-size:17px;color:var(--ink)}
.tgcard ol{margin:0;padding:0 20px 12px 20px;list-style:none;counter-reset:g}
.tgcard li{counter-increment:g;font-size:14px;line-height:1.55;padding:9px 0 9px 34px;position:relative;border-top:1px solid var(--line);color:rgba(1,26,87,.85)}
.tgcard li::before{content:counter(g);position:absolute;left:0;top:9px;font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.1em}

/* ---------- search results ---------- */
.result{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:16px 0;cursor:pointer}
.result:hover .rt{color:var(--gold)}
.result .badge{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--green)}
.result .rt{font-size:16px;margin:4px 0 4px;color:var(--ink)}
.result .snip{font-size:13.5px;color:rgba(1,26,87,.66);line-height:1.5}
mark{background:#F5EFC9;color:inherit;padding:0 1px}
.empty{padding:40px 0;color:rgba(1,26,87,.6);max-width:52ch}

/* ---------- utility ---------- */
.note{font-size:12.5px;color:rgba(1,26,87,.55);max-width:70ch;margin:0 0 24px}
.printhint{position:fixed;left:0;right:0;bottom:0;z-index:999;background:var(--forest);color:#fff;
  padding:11px 20px;font-size:13.5px;text-align:center;box-shadow:0 -4px 16px rgba(0,0,0,.18)}
.printhint button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:2px;
  padding:2px 10px;margin-left:12px;font-size:12px;cursor:pointer}
.printhint button:hover{border-color:#fff}
.pfallback{position:fixed;inset:0;z-index:1000;background:rgba(1,26,87,.45);display:flex;
  align-items:center;justify-content:center;padding:24px}
.pfbox{background:#fff;border-top:5px solid var(--green);border-radius:2px;max-width:620px;width:100%;
  padding:26px 30px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
.pfbox h4{margin:0 0 10px;font-size:19px;color:var(--gold)}
.pfbox p{margin:0 0 14px;font-size:14px;line-height:1.6;color:var(--ink)}
.pflink{display:inline-block;background:var(--green);color:#fff;text-decoration:none;
  padding:9px 16px;border-radius:2px;font-size:14px}
.pflink:hover{background:#1b7d51}
.pfnote{font-size:12.5px;color:rgba(1,26,87,.6)}
.pfrow{display:flex;gap:8px;margin-bottom:14px}
.pfrow input{flex:1;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:2px;
  font-family:inherit;font-size:12.5px;color:var(--ink);background:#fbfaf7}
@media print{.pfallback{display:none!important}}
.printbtn{background:var(--green);color:#fff;border:0;padding:9px 16px;border-radius:2px;cursor:pointer;font-size:13.5px}
.printbtn:hover{background:#1b7d51}
.rowend{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}


/* ---------- global citizenship ---------- */
.gcstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:0 0 30px}
.mode{border-top:4px solid var(--e1);background:var(--beige);padding:14px 16px;border-radius:2px}
.mode h6{margin:0 0 6px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--forest)}
.mode p{margin:0;font-size:13.5px;line-height:1.5}
.mode:nth-child(2){border-top-color:var(--e2)}
.mode:nth-child(3){border-top-color:var(--e3)}
.mode:nth-child(4){border-top-color:var(--e4)}
.conceptrow{border-top:1px solid var(--line);padding:24px 0 4px}
.conceptrow .top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.conceptrow h3{margin:0;font-size:19px;color:var(--ink)}
.conceptrow .tgline{font-size:14px;color:rgba(1,26,87,.72);max-width:82ch;margin:6px 0 0}
.sdg{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:700;white-space:nowrap}
.yrcells{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}
.yrcell{border:1px solid var(--line);border-top:3px solid var(--e1);border-radius:2px;padding:11px 13px;font-size:13px;line-height:1.45;text-align:left;background:#fff;cursor:pointer}
.yrcell:hover{border-color:var(--sheer);background:#fffdf9}
.yrcell .yh{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(1,26,87,.5);font-weight:700;display:block;margin-bottom:5px}
.yrcell .tp{font-weight:700;display:block;margin-bottom:4px;color:var(--ink)}
.yrcell.blank{background:repeating-linear-gradient(135deg,#fff,#fff 7px,#faf8f4 7px,#faf8f4 14px);border-top-color:var(--line);color:rgba(1,26,87,.4);cursor:default}
.phasegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.phase{border:1px solid var(--line);border-radius:2px;padding:13px 15px;font-size:13px;line-height:1.5}
.phase.primary{background:var(--beige);border-color:var(--sheer)}
.phase .ph{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--gold);display:block;margin-bottom:7px}
.phase .ksu2{margin-top:10px;padding-top:9px;border-top:1px solid rgba(1,26,87,.12);font-size:12.5px;color:rgba(1,26,87,.75)}
.phase .ksu2 b{color:var(--forest)}
.commit{border-top:1px solid var(--line);padding:18px 0}
.commit h6{margin:0 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.commit ul{margin:0;padding-left:18px}
.commit li{font-size:14px;line-height:1.55;margin-bottom:5px}

/* ---------- task builder ---------- */
.builder{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:start}
.pool{border:1px solid var(--line);border-radius:2px;max-height:330px;overflow:auto;padding:4px 0;margin-bottom:26px}
.poolgroup{padding:12px 16px 4px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold)}
.kpiopt{display:flex;gap:10px;align-items:flex-start;padding:7px 16px;font-size:13.5px;line-height:1.45;cursor:pointer}
.kpiopt:hover{background:var(--beige)}
.kpiopt input{margin-top:3px;accent-color:var(--green);flex:0 0 auto}
.kpiopt .src{display:block;font-size:11.5px;color:rgba(1,26,87,.5)}
.field{margin-bottom:20px}
.field label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
.field .fh{font-size:12.5px;color:rgba(1,26,87,.6);margin-bottom:8px}
.field textarea{width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;font-family:inherit;font-size:14px;line-height:1.5;color:var(--ink);resize:vertical;background:#fff}
.field textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
.letter{display:inline-block;background:var(--gold);color:#fff;width:19px;height:19px;line-height:19px;text-align:center;border-radius:2px;font-size:11px;margin-right:8px;font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.bank button{font-size:12px;border:1px solid var(--line);background:#fff;padding:3px 9px;border-radius:2px;cursor:pointer;color:rgba(1,26,87,.72)}
.bank button:hover{border-color:var(--green);color:var(--ink)}
.bank .bl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(1,26,87,.45);align-self:center;margin-right:2px}
select.unitsel{padding:8px 12px;border:1px solid var(--line);border-radius:2px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;max-width:100%}
.taskcard{border:1px solid var(--line);border-top:5px solid var(--green);border-radius:2px;padding:22px 26px;position:sticky;top:78px}
.taskcard .tcap{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--green)}
.taskcard h3{margin:6px 0 4px;font-size:21px;color:var(--gold)}
.taskcard .row{padding:13px 0;border-bottom:1px solid var(--line)}
.taskcard .row:last-child{border-bottom:0}
.taskcard .rl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:4px}
.taskcard .rv{font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.taskcard ul{margin:0;padding-left:18px}
.taskcard li{font-size:14px;line-height:1.5;margin-bottom:6px}
.muted{color:rgba(1,26,87,.4)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ghost{background:#fff;border:1px solid var(--line);padding:9px 16px;border-radius:2px;cursor:pointer;font-size:13.5px;color:var(--ink)}
.ghost:hover{border-color:var(--green)}
@media (max-width:1000px){.builder{grid-template-columns:1fr}.taskcard{position:static}}
@media (max-width:900px){.gcstrip{grid-template-columns:repeat(2,1fr)}.yrcells{grid-template-columns:repeat(2,1fr)}}

/* ---------- unit planner ---------- */
.stagehead{display:flex;align-items:baseline;gap:12px;margin:44px 0 4px;padding-top:26px;border-top:3px solid var(--forest)}
.stagehead:first-of-type{margin-top:28px;padding-top:0;border-top:0}
.stagehead h3{margin:0;font-size:20px;color:var(--forest)}
.stagehead .stagenum{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--gold);white-space:nowrap}
.stagesub{font-size:13.5px;color:rgba(1,26,87,.62);margin:2px 0 20px;max-width:76ch}
.plangrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px;margin-bottom:20px}
.plangrid .wide{grid-column:1/-1}
.plangrid label,.pfield label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:rgba(1,26,87,.55);margin-bottom:4px}
.plangrid input,.pfield input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:2px;font-family:inherit;font-size:14px;color:var(--ink);background:#fff}
.pfield{margin-bottom:20px}
.pfield .fh{font-size:12.5px;color:rgba(1,26,87,.6);margin-bottom:8px;max-width:74ch}
.pfield textarea{width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;
  font-family:inherit;font-size:14px;line-height:1.55;color:var(--ink);resize:vertical;background:#fff}
.pfield textarea:focus,.plangrid input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
.pfield.small textarea{min-height:48px}
.pfrow2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wheelcard{border:1px solid var(--line);border-radius:2px;margin-bottom:16px;overflow:hidden}
.wheelcard .wcap{height:5px}
.wheelcard .wbody{padding:16px 20px 20px}
.wheelcard h4{margin:0 0 6px;font-size:16.5px;color:var(--ink)}
.wheelcard .wblurb{font-size:13px;color:rgba(1,26,87,.65);margin:0 0 12px;line-height:1.5}
.wheelsubs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.wheelsub{background:var(--beige);border-radius:2px;padding:13px 15px}
.wheelsub h5{margin:0 0 6px;font-size:12.5px;color:var(--forest)}
.lessonform{border:1px solid var(--line);border-radius:2px;padding:16px 18px;margin-bottom:18px;background:#fbfaf7}
.lessonform .lgrid{display:grid;grid-template-columns:70px 70px 1fr 1fr;gap:10px 12px;margin-bottom:10px}
.lessonform .lgrid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px;margin-bottom:10px}
.lessonform input,.lessonform textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:2px;
  font-family:inherit;font-size:13.5px;color:var(--ink);background:#fff;min-height:38px;resize:vertical}
.lessonform label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:rgba(1,26,87,.5);margin-bottom:3px}
.lessontable{overflow-x:auto;margin-bottom:8px}
.lessontable table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.5px}
.lessontable th,.lessontable td{border:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
.lessontable th{background:var(--beige);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--forest)}
.lessontable td button{background:none;border:0;color:var(--gold);cursor:pointer;font-size:12px;white-space:nowrap}
.emptylessons{font-size:13.5px;color:rgba(1,26,87,.45);padding:14px 0}
.considrow{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:16px 0;border-top:1px solid var(--line);align-items:start}
.considrow h5{margin:0 0 4px;font-size:14px;color:var(--ink)}
.considrow .cprompt{font-size:12.5px;color:rgba(1,26,87,.6);margin:0;line-height:1.5}
.ratingblock{border-top:1px solid var(--line);padding:16px 0}
.ratingblock .rtg{font-size:14px;color:var(--ink);margin:0 0 10px;max-width:74ch;line-height:1.5}
.ratingchips{display:flex;flex-wrap:wrap;gap:6px}
.chip.rate{padding:5px 11px;font-size:12.5px}
.checklist{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:2px;padding:4px 0}
.considrow textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:2px;font-family:inherit;
  font-size:13.5px;line-height:1.5;color:var(--ink);background:#fff;min-height:44px;resize:vertical}
.considrow textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:transparent}
.planprint{display:none}
.plantabs{display:flex;flex-wrap:wrap;gap:2px;margin:22px 0 0;border-bottom:2px solid var(--line)}
.plantab{background:none;border:0;border-bottom:3px solid transparent;padding:11px 15px;margin-bottom:-2px;
  font-family:inherit;font-size:13.5px;color:rgba(1,26,87,.62);cursor:pointer;white-space:nowrap}
.plantab:hover{color:var(--ink);background:rgba(1,26,87,.03)}
.plantab[aria-selected="true"]{color:var(--forest);font-weight:700;border-bottom-color:var(--e1)}
.plantab:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.ptab[hidden]{display:none}
@media print{.plantabs{display:none!important}}
.plansection{margin:0 0 32px}
.plansection>h3{font-size:15px;color:var(--forest);margin:26px 0 3px;letter-spacing:.02em}
.plansection>h3:first-child{margin-top:0}
.plansection .pssub{font-size:12px;color:rgba(1,26,87,.55);margin:0 0 12px;max-width:80ch}
.psrow{padding:9px 0;border-bottom:1px solid var(--line)}
.psrow:last-child{border-bottom:0}
.psl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:3px}
.psv{font-size:13px;line-height:1.55;white-space:pre-wrap}
.psv .muted{color:rgba(1,26,87,.35)}
.planprint table{border-collapse:collapse;width:100%;font-size:11px;margin-top:6px}
.planprint th,.planprint td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.planprint th{background:var(--beige);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--forest)}
.pschecks{font-size:13px;line-height:1.8}

/* ---------- stage 1 curriculum foundations ---------- */
.foundwrap{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}
.foundblock{border:1px solid var(--line);border-left:3px solid var(--e1);border-radius:2px;padding:13px 16px;background:#fff}
.foundblock .fhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.foundblock h5{margin:0;font-size:13.5px;color:var(--forest);letter-spacing:.01em}
.foundblock .fmod{font-size:11px;color:rgba(1,26,87,.5);font-style:italic}
.fsec{margin-bottom:8px}
.fsec:last-child{margin-bottom:0}
.fsec .fl{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--gold);margin-bottom:3px}
.fsec ul{margin:0;padding-left:16px}
.fsec li{font-size:12.5px;line-height:1.5;margin-bottom:3px;color:rgba(1,26,87,.85)}
.fsec li b{color:var(--ink)}
.foundblock .ftheme{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--green)}
.outcome{border-top:1px solid var(--line);padding:9px 0 2px}
.outcome:first-of-type{border-top:0}
.ocode{display:inline-block;background:var(--forest);color:#fff;font-size:10px;font-weight:700;
  letter-spacing:.08em;padding:2px 7px;border-radius:2px;margin-bottom:5px}
.okpi{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:5px;font-weight:600}
.oksu{font-size:12.5px;line-height:1.5;color:rgba(1,26,87,.8);margin-bottom:3px;padding-left:16px;text-indent:-16px}
.oksu b{display:inline-block;width:12px;color:var(--gold);font-size:10.5px}
.oeq{font-size:12.5px;line-height:1.5;font-style:italic;color:var(--green);margin-top:6px;
  padding-left:10px;border-left:2px solid var(--e2)}
.outtext{font-size:12.5px;line-height:1.55;white-space:pre-wrap;color:rgba(1,26,87,.85)}
.pcode{display:inline-block;background:var(--beige);color:var(--forest);font-size:9.5px;font-weight:700;
  letter-spacing:.06em;padding:1px 5px;border-radius:2px;margin-right:6px;vertical-align:1px}
.fsec.eqsec{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.fsec.eqsec .fl{color:var(--green)}
.fsec.eqsec li{font-style:italic;color:var(--ink)}

@media (max-width:900px){.foundwrap{grid-template-columns:1fr}}
@media (max-width:900px){
  .plangrid{grid-template-columns:repeat(2,1fr)}
  .wheelsubs{grid-template-columns:1fr}
  .lessonform .lgrid,.lessonform .lgrid2{grid-template-columns:1fr 1fr}
  .considrow{grid-template-columns:1fr}
  .pfrow2{grid-template-columns:1fr}
}

@media (max-width:900px){
  :root{--rail:0px}
  .rail{position:static;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center}
  .brand{padding:18px 20px 12px;flex:1 1 100%}
  .nav{flex-direction:row;flex-wrap:wrap;padding:0 12px 12px}
  .nav button .tick{display:none}
  .railfoot{display:none}
  .main{margin-left:0}
  .topbar,.wrap{padding-left:20px;padding-right:20px}
  .track{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .rail,.topbar,.back,.printbtn,.chips,.printhint{display:none!important}
  .main{margin:0}.wrap{padding:0}
  .card,.panel,.taskcard,.conceptrow,.wheelcard,.plansection{break-inside:avoid}
  .buildform,.pool{display:none!important}
  .builder{grid-template-columns:1fr}.taskcard{position:static;border:0;padding:0}
  .planform,.planactions,.planhead{display:none!important}
  .planprint{display:block!important}
  body{font-size:12px}
}
</style>

{ y:5, term:"Term 1.2", topic:"Greek Odyssey",

<script>
(function(){
  "use strict";
  var UNITS = window.GIS_UNITS, REF = window.GIS_REF, PROG = window.GIS_PROG;

  var STRANDS = [
    {key:"gc",    label:"Global citizenship & intercultural learning", color:"var(--green)"},
    {key:"ls",    label:"GIS learner skill",   color:"var(--gold)"},
    {key:"geo",   label:"Geography",           color:"var(--e1)"},
    {key:"hist",  label:"History",             color:"var(--e4)"},
    {key:"dt",    label:"Design technology",   color:"var(--e3)"},
    {key:"sci",   label:"Science",             color:"var(--forest)"},
    {key:"dl",    label:"Digital learning",    color:"var(--ink)"},
    {key:"eng",   label:"English",             color:"var(--gold)"},
    {key:"pshe",  label:"PSHE / SEL",          color:"var(--sheer)"}
  ];
  var SUBJCOLOR = {"GEOGRAPHY":"var(--e1)","HISTORY":"var(--e4)","DESIGN TECHNOLOGY":"var(--e3)","DIGITAL LEARNING":"var(--ink)"};
  var TGCOLOR = ["var(--e1)","var(--e4)","var(--e3)","var(--ink)","var(--green)","var(--gold)","var(--e2)","var(--sheer)","var(--forest)","var(--green)"];
  var VIEWS = [
    {id:"year",  label:"Year map"},
    {id:"prog",  label:"Progression"},
    {id:"gc",    label:"Global citizenship"},
    {id:"tg",    label:"Transfer goals"},
    {id:"plan",  label:"Unit planner"},
    {id:"ref",   label:"Reference tables"}
  ];
  var GC = window.GIS_GC, GR = window.GIS_GRASPS, PL = window.GIS_PLANNER;

  var state = {view:"year", year:2, unit:null, subject:0, open:null, ref:"science", q:"", gcMode:"years",
    planYear:2, plan:null, newLesson:null, planTab:"details"};
  var el = function(id){return document.getElementById(id)};

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  function nl(s){return esc(s).replace(/\n/g,"<br>")}
  /* bold the K/S/U and KPI labels inside strand text */
  function fmt(s){
    return nl(s).replace(/(KPI[^:<]{0,14}:|Knowledge:|Skills:|Understanding:|Science KPIs?[^:<]{0,10}:|History KPIs?[^:<]{0,10}:|Geography KPIs?[^:<]{0,10}:|Computing KPIs?[^:<]{0,10}:|DT KPIs?[^:<]{0,10}:|DL KPIs?[^:<]{0,10}:|GC KPI[^:<]{0,10}:|SEL\/PSHE[^:<]{0,12}:)/g,"<b>$1</b>");
  }
  function unitsFor(y){return UNITS.filter(function(u){return u.y===y})}
  function ymd(u){return "Year "+u.y+" · "+u.term}

  /* ---------------- printing from inside an embed ---------------- */
  /* Embedded pages (Google Sites and most other iframe embeds) sandbox
     window.print() the same way they sandbox alert()/confirm() — the call
     is silently ignored unless the embedder opts in, which most don't.
     When we detect we're framed, hand the same view to a fresh, unframed
     tab and print from there instead. */
  function inFrame(){
    try{ return window.self !== window.top; }catch(e){ return true; }
  }
  /* The plan travels in the URL so a printable copy can open in its own tab.
     Only what the teacher actually changed is carried — everything the planner
     generates from the curriculum map is rebuilt at the other end, which keeps
     the link short enough to paste by hand when it comes to that. */
  function compactPlan(p){
    var base = blankPlan(p.unit), diff = {};
    function walk(cur, ref, path){
      for(var k in cur){
        if(!Object.prototype.hasOwnProperty.call(cur,k)) continue;
        var a = cur[k], b = ref ? ref[k] : undefined;
        var key = path ? path+"."+k : k;
        if(a && typeof a === "object" && !Array.isArray(a)){ walk(a, b || {}, key); }
        else if(JSON.stringify(a) !== JSON.stringify(b)){ diff[key] = a; }
      }
    }
    walk(p, base, "");
    delete diff.unit; delete diff.year;
    return {u:p.unit, d:diff};
  }
  function expandPlan(c){
    if(typeof c.u !== "number" || !UNITS[c.u]) return null;
    var p = blankPlan(c.u);
    Object.keys(c.d || {}).forEach(function(key){
      var parts = key.split("."), o = p;
      for(var i=0;i<parts.length-1;i++){ if(o[parts[i]]==null) o[parts[i]]={}; o = o[parts[i]]; }
      o[parts[parts.length-1]] = c.d[key];
    });
    return p;
  }
  function printPayload(){
    if(state.view === "plan" && state.plan) return {v:"p", c: compactPlan(state.plan)};
    return {v:"u", u: state.unit};
  }
  function applyPrintPayload(payload){
    if(payload.v === "p" && payload.c){
      var p = expandPlan(payload.c);
      if(!p) return false;
      state.view = "plan"; state.planYear = UNITS[p.unit].y; state.plan = p;
      state.newLesson = emptyLesson(); return true;
    }
    if(payload.v === "u" && typeof payload.u === "number" && UNITS[payload.u]){
      state.view = "year"; state.year = UNITS[payload.u].y; state.unit = payload.u; return true;
    }
    return false;
  }
  function printURL(){
    return location.origin + location.pathname + "#print=" + encodeURIComponent(JSON.stringify(printPayload()));
  }
  function showPrintHint(){
    var d = document.createElement("div");
    d.className = "printhint";
    d.innerHTML = "This tab opened so you can print. If the dialog didn't appear, press Ctrl+P (Cmd+P on Mac)."
      + '<button id="printhintbtn">Print now</button>';
    document.body.appendChild(d);
    document.getElementById("printhintbtn").addEventListener("click", function(){ window.print(); });
  }
  function tryHandlePrintHash(){
    if(location.hash.indexOf("#print=") !== 0) return false;
    var payload;
    try{ payload = JSON.parse(decodeURIComponent(location.hash.slice(7))); }
    catch(e){ return false; }
    if(!applyPrintPayload(payload)) return false;
    render();
    showPrintHint();
    setTimeout(function(){ window.print(); }, 450);
    return true;
  }
  /* Google Sites sandboxes its embeds without allow-popups, so window.open is
     refused outright and no browser setting will change that. When that happens
     we hand the teacher the link instead. */
  function printFallback(url){
    var old = document.getElementById("printfallback");
    if(old) old.parentNode.removeChild(old);
    var d = document.createElement("div");
    d.id = "printfallback";
    d.className = "pfallback";
    d.innerHTML =
      '<div class="pfbox">'
      + '<h4>Open the printable version in a new tab</h4>'
      + '<p>This page is embedded in another site, and embedded pages are not allowed to open '
      + 'tabs or show the print dialog. Use the link below and print from there — everything you '
      + 'have typed is included.</p>'
      + '<p><a class="pflink" href="' + esc(url) + '" target="_blank" rel="noopener">Open printable version</a>'
      + ' <span class="pfnote">(if the link does nothing, copy it instead)</span></p>'
      + '<div class="pfrow"><input id="pfurl" readonly value="' + esc(url) + '">'
      + '<button class="ghost" id="pfcopy">Copy link</button></div>'
      + '<p class="pfnote">Tip: opening the navigator directly on its own web address, rather than '
      + 'through the embed, lets the print button work normally.</p>'
      + '<button class="ghost" id="pfclose">Close</button>'
      + '</div>';
    document.body.appendChild(d);
    var input = document.getElementById("pfurl");
    input.focus(); input.select();
    document.getElementById("pfcopy").addEventListener("click", function(){
      var btn = this, done = function(ok){ btn.textContent = ok ? "Copied" : "Press Ctrl/Cmd+C"; };
      input.focus(); input.select();
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(input.value).then(function(){done(true)}, function(){
            try{ done(document.execCommand("copy")); }catch(e){ done(false); }
          });
        } else { done(document.execCommand("copy")); }
      }catch(e){ done(false); }
    });
    document.getElementById("pfclose").addEventListener("click", function(){
      d.parentNode.removeChild(d);
    });
  }
  function doPrint(btn){
    if(!inFrame()){ window.print(); return; }
    var url = printURL(), w = null;
    try{ w = window.open(url, "_blank"); }catch(e){ w = null; }
    if(!w) printFallback(url);
  }

  /* ---------------- unit planner ---------------- */
  function gckey(x){return String(x||"").toLowerCase().replace(/[^a-z]/g,"")}
  function refGoalsFor(subjectName){
    var e = REF.transferGoals.filter(function(t){return t.subject===subjectName})[0];
    return e ? e.goals : [];
  }
  var SUBJ_META = [
    {key:"gc",   name:"Global Citizenship & Intercultural Learning", prog:null},
    {key:"geo",  name:"Geography",         prog:"GEOGRAPHY"},
    {key:"hist", name:"History",           prog:"HISTORY"},
    {key:"dt",   name:"Design Technology", prog:"DESIGN TECHNOLOGY"},
    {key:"dl",   name:"Digital Learning",  prog:"DIGITAL LEARNING"}
  ];
  /* A curriculum code looks like 4GC1 / 2G3 / 6DT2 / 3DL1 — the year, the
     subject, then the number of the transfer goal it belongs to. That last
     digit is what links an outcome to its long-term goal. */
  function parseCode(code){
    var m = /^(\d)([A-Z]{1,3})(\d*)$/.exec(String(code||""));
    return m ? {year:+m[1], subject:m[2], goal:m[3]?+m[3]:null} : null;
  }
  function tgForOutcome(progName, code){
    var p = parseCode(code);
    if(!p || !p.goal || !progName) return null;
    var sub = PROG.filter(function(s){return s.name===progName})[0];
    if(!sub) return null;
    var g = sub.goals[p.goal-1];
    return g ? {code:g.code, label:g.title, full:g.full||g.title} : null;
  }
  function gcConceptFor(u){
    var uk = gckey(u.gcTheme);
    return GC.concepts.filter(function(c){
      var ck = gckey(c.name);
      return ck.indexOf(uk.slice(0,10))===0 || uk.indexOf(ck.slice(0,10))===0;
    })[0] || null;

  /* The full Stage 1 curriculum picture: every subject linked to the topic,
     with its coded outcomes and the transfer goal each one ladders up to. */
  function unitFoundations(u){
    var out = [];
    SUBJ_META.forEach(function(m){
      var list = (u.out && u.out[m.key]) || [];
      if(!list.length) return;
      var block = {subject:m.name, key:m.key, outcomes:[], tgs:[]};
      if(m.key === "gc"){
        var concept = gcConceptFor(u);
        block.theme = u.gcTheme || "";
        block.sdg = concept ? concept.sdg : "";
        if(concept) block.tgs = [{code:"TG", label:concept.name, full:concept.tg}];
      }
      var seen = {};
      list.forEach(function(o){
        block.outcomes.push(o);
        var tg = tgForOutcome(m.prog, o.code);
        if(tg && !seen[tg.code]){ seen[tg.code]=1; block.tgs.push(tg); }
      });
      out.push(block);
    });
    if(u.out && u.out.sci){
      var s = u.out.sci;
      out.push({subject:"Science", key:"sci", module:s.module, outcomes:[s],
        tgs: refGoalsFor("Science").map(function(g,i){return {code:"TG"+(i+1), label:"", full:g}})});
    }
    if(u.eng)  out.push({subject:"English", key:"eng", outcomes:[{kpi:u.eng}],
      tgs: refGoalsFor("English").map(function(g,i){return {code:"TG"+(i+1), label:"", full:g}})});
    if(u.pshe) out.push({subject:"PSHE / SEL", key:"pshe", outcomes:[{kpi:u.pshe}],
      tgs: refGoalsFor("SEL").map(function(g,i){return {code:"TG"+(i+1), label:"", full:g}})});
    if(u.ls)   out.push({subject:"GIS Learner Skill", key:"ls", outcomes:[{kpi:u.ls}], tgs:[]});
    return out;
  }
  function allOutcomes(u){
    var out = [];
    SUBJ_META.forEach(function(m){
      ((u.out && u.out[m.key]) || []).forEach(function(o){ out.push({subject:m.name, key:m.key, o:o}); });
    });
    if(u.out && u.out.sci) out.push({subject:"Science", key:"sci", o:u.out.sci});
    return out;
  }
  function foundationsHTML(u){
    var f = unitFoundations(u);
    if(!f.length) return "";
    return f.map(function(b){
      var h = '<div class="foundblock"><div class="fhead"><h5>'+esc(b.subject)+'</h5>'
        + (b.theme?'<span class="ftheme">'+esc(b.theme)+'</span>':'')
        + (b.sdg?'<span class="sdg">'+esc(b.sdg)+'</span>':'')
        + (b.module?'<span class="fmod">'+esc(b.module)+'</span>':'') + '</div>';
      b.outcomes.forEach(function(o){
        if(!o.code){ h += '<div class="fsec"><div class="outtext">'+nl(o.kpi)+'</div></div>'; return; }
        h += '<div class="outcome"><div class="ocode">'+esc(o.code)+'</div>'
           + '<div class="okpi">'+esc(o.kpi)+'</div>'
           + (o.k?'<div class="oksu"><b>K</b> '+esc(o.k)+'</div>':'')
           + (o.s?'<div class="oksu"><b>S</b> '+esc(o.s)+'</div>':'')
           + (o.u?'<div class="oksu"><b>U</b> '+esc(o.u)+'</div>':'')
           + (o.eq?'<div class="oeq">'+esc(o.eq)+'</div>':'')
           + '</div>';
      });
      return h + '</div>';
    }).join("");
  }
  function foundationsText(u){
    return unitFoundations(u).map(function(b){
      var out = [b.subject.toUpperCase() + (b.theme?" — "+b.theme:"")];
      b.outcomes.forEach(function(o){
        if(!o.code){ out.push(o.kpi); return; }
        out.push(o.code + ": " + o.kpi);
        if(o.k) out.push("  Knowledge: " + o.k);
        if(o.s) out.push("  Skills: " + o.s);
        if(o.u) out.push("  Understanding: " + o.u);
        if(o.eq) out.push("  Essential question: " + o.eq);
      });
      return out.join("\n");
    }).join("\n\n");
  }
  function compileStage1(u){
    var knowledge = [], skills = [], understanding = [], essential = [], outcomeParts = [], ccl = [];
    unitFoundations(u).forEach(function(b){
      if(b.key === "ls") return;
      ccl.push(b.subject);
      var seg = [b.subject.toUpperCase() + (b.theme?" — "+b.theme:"")];
      b.outcomes.forEach(function(o){
        if(!o.code){ seg.push(o.kpi); return; }
        seg.push(o.code + ": " + o.kpi);
        if(o.k) knowledge.push(o.code + " — " + o.k);
        if(o.s) skills.push(o.code + " — " + o.s);
        if(o.u) understanding.push(o.code + " — " + o.u);
        if(o.eq) essential.push(o.code + " — " + o.eq);
      });
      outcomeParts.push(seg.join("\n"));
    });
    return {
      learningOutcomes: outcomeParts.join("\n\n"),
      knowledge: knowledge.map(function(x){return "• "+x}).join("\n"),
      skills: skills.map(function(x){return "• "+x}).join("\n"),
      enduring: understanding.map(function(x){return "• "+x}).join("\n"),
      essential: essential.map(function(x){return "• "+x}).join("\n"),
      ccls: ccl.length ? "This unit draws on: " + ccl.join(", ") + "." : ""
    };
  }

  /* ---------------- search ---------------- */
  function buildIndex(){
    var idx = [];
    UNITS.forEach(function(u,i){
      var bits = [u.topic,u.idea,u.gcTheme,u.ls,u.eng,u.pshe];
      allOutcomes(u).forEach(function(x){ bits.push(x.o.code,x.o.kpi,x.o.k,x.o.s,x.o.u,x.o.eq); });
      idx.push({type:"Unit", badge:"Year "+u.y+" · "+u.term, title:u.topic,
        text:bits.filter(Boolean).join(" \u00b7 "),
        go:function(){state.view="year";state.year=u.y;state.unit=i;}});
      allOutcomes(u).forEach(function(x){
        idx.push({type:"Outcome", badge:x.o.code+" · "+x.subject+" · Year "+u.y,
          title:x.o.kpi,
          text:[x.o.code,x.o.kpi,x.o.k,x.o.s,x.o.u,x.o.eq,u.topic].filter(Boolean).join(" \u00b7 "),
          go:function(){state.view="year";state.year=u.y;state.unit=i;}});
      });
    });
    PROG.forEach(function(s,si){
      s.goals.forEach(function(g,gi){
        g.years.forEach(function(c,yi){
          if(!c) return;
          idx.push({type:"KPI", badge:(s.title||title(s.name))+" · Year "+(yi+1)+" · "+g.code, title:c.kpi,
            text:[c.kpi,c.knowledge,c.skills,c.understanding,g.title,g.full].filter(Boolean).join(" \u00b7 "),
            go:function(){state.view="prog";state.subject=si;state.open=si+"-"+gi+"-"+yi;}});
        });
      });
    });
    REF.transferGoals.forEach(function(t,ti){
      t.goals.forEach(function(g){
        idx.push({type:"Transfer goal", badge:t.subject, title:g, text:g, go:function(){state.view="tg";}});
      });
    });
    GC.concepts.forEach(function(c){
      idx.push({type:"Transfer goal", badge:"Global citizenship · "+c.name, title:c.tg, text:[c.tg,c.sdg].join(" · "), go:function(){state.view="tg";}});
      [1,2].forEach(function(i){
        var k = c.ksu[i];
        idx.push({type:"Global citizenship", badge:c.name+" · "+GC.phases[i], title:c.outcomes[i],
          text:[c.outcomes[i],k?k.k:"",k?k.s:"",k?k.u:""].filter(Boolean).join(" · "),
          go:function(){state.view="gc";state.gcMode="phase";}});
      });
    });
    REF.scienceModules.forEach(function(m){
      m.years.forEach(function(c,yi){
        if(!c) return;
        idx.push({type:"Science", badge:m.module+" · Year "+(yi+1), title:trim(c,90), text:c, go:function(){state.view="ref";state.ref="science";}});
      });
    });
    return idx;
  }
  var INDEX = null;
  function viewSearch(){
    if(!INDEX) INDEX = buildIndex();
    var q = state.q.toLowerCase();
    var hits = INDEX.filter(function(r){return (r.title+" "+r.text).toLowerCase().indexOf(q)>-1}).slice(0,60);
    var h = head("Search","");
    h = h.replace('</div>','</div>');
    if(!hits.length){
      return h+'<div class="empty"><p>Nothing matches “'+esc(state.q)+'”.</p><p>Try a KPI verb (<b>evaluate</b>, <b>debug</b>), a topic (<b>Pompeii</b>), or a strand (<b>habitats</b>, <b>sustainability</b>).</p></div>';
    }
    h += '<p class="note">'+hits.length+(hits.length===60?'+':'')+' match'+(hits.length===1?'':'es')+' for “'+esc(state.q)+'”.</p>';
    h += hits.map(function(r,i){
      return '<button class="result" data-hit="'+i+'"><span class="badge">'+esc(r.type)+' — '+esc(r.badge)+'</span>'
        +'<div class="rt">'+mark(r.title,q)+'</div><div class="snip">'+mark(snippet(r.text,q),q)+'</div></button>';
    }).join("");
    window.__hits = hits;
    return h;
  }
  function snippet(t,q){
    var i = t.toLowerCase().indexOf(q);
    if(i<0) return trim(t,150);
    var s = Math.max(0,i-60);
    return (s>0?"…":"")+trim(t.slice(s),170);
  }
  function mark(t,q){
    if(!q) return esc(t);
    var out="",low=t.toLowerCase(),i=0,j;
    while((j=low.indexOf(q,i))>-1){ out += esc(t.slice(i,j))+"<mark>"+esc(t.substr(j,q.length))+"</mark>"; i=j+q.length; }
    return out+esc(t.slice(i));
  }

  function head(t,l){
    return '<div class="eyebrow">GIS Primary · Topic curriculum</div><div class="ebar short"><span></span><span></span><span></span><span></span></div>'

  function render(){
    renderNav();

    if(state.q.trim().length>1) v.innerHTML = viewSearch();
    else if(state.view==="year") v.innerHTML = viewYear();
    else if(state.view==="prog") v.innerHTML = viewProg();
    else if(state.view==="gc")   v.innerHTML = viewGC();
    else if(state.view==="tg")   v.innerHTML = viewTG();
    else if(state.view==="plan") v.innerHTML = viewPlan();
    else if(state.view==="build"){ state.view="plan"; v.innerHTML = viewPlan(); }
    else v.innerHTML = viewRef();
    el("hint").textContent = UNITS.length+" units · Years 1–6";
    window.scrollTo({top:0,behaviour:"instant" in window ? "auto":"auto"});
  }

    /* planner GRASPS stems / idea banks — fill in place, no full re-render */
    var pst = e.target.closest("[data-pstem]");
    if(pst){
      var ppath = pst.dataset.pstem, ptxt = pst.dataset.text;
      var pta = document.querySelector('textarea[data-pf="'+ppath+'"]');
      var pcur = String(getPlanVal(ppath)||"").replace(/\s*$/,"");
      setPlanVal(ppath, pcur ? pcur + "\n" + ptxt : ptxt);
      if(pta){ pta.value = getPlanVal(ppath); pta.focus(); }
      paintPlanPrint(); return;
    }
    /* rating chips repaint in place so the page doesn't jump back to the top */
    var rt = e.target.closest("[data-tgrate]");
    if(rt){
      state.plan.post.tg[rt.dataset.tgrate] = rt.dataset.val;
      paintTgRatings(); paintPlanPrint(); return;
    }
    var lr = e.target.closest("[data-learnrate]");
    if(lr){
      state.plan.post.learner[+lr.dataset.learnrate] = lr.dataset.val;
      var wrap = lr.closest(".ratingblock");
      if(wrap){
        wrap.querySelectorAll("[data-learnrate]").forEach(function(c){
          c.setAttribute("aria-pressed", c.dataset.val === lr.dataset.val ? "true" : "false");
        });
      }
      paintPlanPrint(); return;
    }

    var t = e.target.closest("[data-view],[data-year],[data-unit],[data-back],[data-subject],[data-cell],[data-ref],[data-hit],[data-print],[data-gcmode],[data-planyearpick],[data-planunit],[data-planback],[data-addlesson],[data-rmlesson],[data-plantab]");
    if(!t) return;
    if(t.dataset.print){ doPrint(t); return; }
    if(t.dataset.view){ state.view=t.dataset.view; state.unit=null; state.q=""; el("q").value=""; }
    else if(t.dataset.year){ state.year=+t.dataset.year; state.unit=null; }
    else if(t.dataset.unit){ state.unit=+t.dataset.unit; state.view="year"; state.year=UNITS[state.unit].y; }
    else if(t.dataset.back){ state.unit=null; }
    else if(t.dataset.subject){ state.subject=+t.dataset.subject; state.open=null; }
    else if(t.dataset.cell){ state.open = state.open===t.dataset.cell ? null : t.dataset.cell; }
    else if(t.dataset.ref){ state.ref=t.dataset.ref; }
    else if(t.dataset.gcmode){ state.gcMode=t.dataset.gcmode; }
    else if(t.dataset.planyearpick){ state.planYear=+t.dataset.planyearpick; }
    else if(t.dataset.planunit){ state.plan=blankPlan(+t.dataset.planunit); state.newLesson=emptyLesson(); state.planTab="details"; }
    else if(t.dataset.planback){ state.plan=null; state.newLesson=null; }
    else if(t.dataset.addlesson){
      if(state.newLesson){
        var hasContent = state.newLesson.stage || PL.lessonFields.some(function(f){ return (state.newLesson[f.key]||"").trim(); });
        if(hasContent){ state.plan.lessons.push(state.newLesson); state.newLesson = emptyLesson(); }
      }
    }
    else if(t.dataset.rmlesson){ state.plan.lessons.splice(+t.dataset.rmlesson,1); }
    else if(t.dataset.plantab){ state.planTab = t.dataset.plantab; }
    else if(t.dataset.hit){ (window.__hits[+t.dataset.hit].go)(); state.q=""; el("q").value=""; }
    render();
  });

  document.addEventListener("input", function(e){
    var pf = e.target.closest("[data-pf]");
    if(pf){ setPlanVal(pf.dataset.pf, pf.value); paintPlanPrint(); return; }
    var pi = e.target.closest("[data-pi]");
    if(pi){ setPlanVal(pi.dataset.pi, pi.value); paintPlanPrint(); return; }
    var nl = e.target.closest("[data-nl]");
    if(nl && state.newLesson){ state.newLesson[nl.dataset.nl] = nl.value; return; }
  });
  document.addEventListener("change", function(e){
    var pbox = e.target.closest("[data-pkpi]");
    if(pbox){
      var pid = pbox.dataset.pkpi, pidx = state.plan.kpis.indexOf(pid);
      if(pbox.checked && pidx<0) state.plan.kpis.push(pid);
      if(!pbox.checked && pidx>-1) state.plan.kpis.splice(pidx,1);
      paintTgRatings();
      paintPlanPrint();
      return;
    }
    var ic = e.target.closest("[data-icheck]");
    if(ic){
      var val = ic.dataset.icheck, arr = state.plan.post.intercultural, ii = arr.indexOf(val);
      if(ic.checked && ii<0) arr.push(val);
      if(!ic.checked && ii>-1) arr.splice(ii,1);
      paintPlanPrint();
      return;
    }
    var nlsel = e.target.closest("[data-nl]");
    if(nlsel && state.newLesson){ state.newLesson[nlsel.dataset.nl] = nlsel.value; }
  });

  var timer;
  el("q").addEventListener("input", function(e){
    clearTimeout(timer);
    var val = e.target.value;
    timer = setTimeout(function(){ state.q = val; state.unit = state.q.trim().length>1 ? state.unit : state.unit; render(); }, 120);
  });

  if(!tryHandlePrintHash()) render();
})();
</script>
</body>
</html>
